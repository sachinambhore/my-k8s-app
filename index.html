<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Nginx</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            text-align: center;
        }

        .card {
            padding: 60px 40px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
        }

        .logo {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        h1 span {
            color: #38bdf8;
        }

        .subtitle {
            font-size: 20px;
            color: #cbd5e1;
            margin-bottom: 40px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 22px;
            border-radius: 30px;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.3);
            margin-bottom: 40px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 12px #4ade80;
        }

        .tech {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .tech-box {
            padding: 25px 15px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tech-box h3 {
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .tech-box p {
            color: #94a3b8;
            font-size: 14px;
        }

        footer {
            margin-top: 35px;
            color: #64748b;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            h1 {
                font-size: 36px;
            }

            .tech {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 40px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="logo">🚀</div>

            <h1>Welcome to <span>Nginx2</span></h1>

            <p class="subtitle">
                High-performance web server successfully deployed.
            </p>

            <div class="status">
                <span class="dot"></span>
                Application is running successfully
            </div>

            <div class="tech">

                <div class="tech-box">
                    <h3>🐳 Docker</h3>
                    <p>Containerized Application</p>
                </div>

                <div class="tech-box">
                    <h3>☸️ Kubernetes</h3>
                    <p>Container Orchestration</p>
                </div>

                <div class="tech-box">
                    <h3>☁️ AWS EKS</h3>
                    <p>Cloud Infrastructure</p>
                </div>

            </div>

            <footer>
                DevOps Deployment Demo • Nginx Web Server
            </footer>

        </div>

    </div>

</body>
</html>
